<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="150" viewBox="0 0 1120 150" role="img" aria-labelledby="title">
  <title id="title">Fluxo de compra: catálogo, carrinho, checkout e confirmação</title>
  <defs>
    <linearGradient id="route">
      <stop stop-color="#8047f8"/>
      <stop offset="1" stop-color="#dbac2c"/>
    </linearGradient>
  </defs>
  <style>
    .surface { fill: #f8f3ff; stroke: #e4d6f2; }
    .station { fill: #fff; stroke: #ded0eb; }
    .step { fill: #40334f; }
    .icon { stroke: #6236ae; }
    .route-marker { animation: deliver 5.5s linear infinite; }
    @keyframes deliver {
      0% { transform: translateX(0); opacity: 0; }
      10%, 90% { opacity: 1; }
      100% { transform: translateX(820px); opacity: 0; }
    }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #21182a; stroke: #493555; }
      .station { fill: #30213e; stroke: #59436c; }
      .step { fill: #f3e9ff; }
      .icon { stroke: #d3b6ff; }
    }
    @media (prefers-reduced-motion: reduce) {
      .route-marker { animation: none; }
    }
  </style>
  <rect class="surface" x=".5" y=".5" width="1119" height="149" rx="21"/>
  <path d="M150 65H970" stroke="url(#route)" stroke-width="2" opacity=".5"/>
  <g class="route-marker">
    <circle cx="150" cy="65" r="9" fill="#dbac2c" opacity=".3"/>
    <circle cx="150" cy="65" r="4" fill="#dbac2c"/>
  </g>
  <g class="station" stroke-width="1.5">
    <circle cx="150" cy="65" r="33"/>
    <circle cx="423" cy="65" r="33"/>
    <circle cx="697" cy="65" r="33"/>
    <circle cx="970" cy="65" r="33"/>
  </g>
  <g class="icon" fill="none" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M139 60h19v10a6 6 0 0 1-6 6h-7a6 6 0 0 1-6-6Zm19 0h3a4 4 0 1 1 0 8h-3m-13-14c-2-3 2-4 0-7m7 7c-2-3 2-4 0-7"/>
    <path d="M409 54h4l4 15h14l4-11h-20m2 11-1 3h16"/><circle cx="419" cy="77" r="1.3"/><circle cx="430" cy="77" r="1.3"/>
    <rect x="684" y="55" width="26" height="20" rx="3"/><path d="M684 61h26m-21 8h6"/>
    <path d="M970 51a10 10 0 0 0-10 10c0 8 10 17 10 17s10-9 10-17a10 10 0 0 0-10-10Z"/><path d="m966 61 3 3 5-5"/>
  </g>
  <g class="step" text-anchor="middle" font-family="system-ui, sans-serif" font-size="23" font-weight="700">
    <text x="150" y="123">Catálogo</text>
    <text x="423" y="123">Carrinho</text>
    <text x="697" y="123">Checkout</text>
    <text x="970" y="123">Confirmação</text>
  </g>
</svg>
